# Builds caffeinate.exe on every push and pull request.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the .exe attached.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & ./bin/caffeinate.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          Write-Host $out

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $built = (& ./bin/caffeinate.exe --version) -replace '^caffeinate\s+', ''
          if ($built -ne $tag) { throw "Tag v$tag does not match Version '$built' in src/caffeinate.cs" }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash ./bin/caffeinate.exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Set-Content ./bin/caffeinate.exe.sha256
          gh release create '${{ github.ref_name }}' ./bin/caffeinate.exe ./bin/caffeinate.exe.sha256 `
            --title '${{ github.ref_name }}' --generate-notes
